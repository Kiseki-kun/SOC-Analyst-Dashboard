# =============================================================================
# SOC Analyst Dashboard - development stack
# =============================================================================
# Start:   docker compose up --build
# Stop:    docker compose down
# Reset:   docker compose down -v     (DESTROYS the database volume)
#
# All ports, credentials and tuning values come from .env (see .env.example).
# =============================================================================

name: soc-analyst-dashboard

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    environment:
      # Guarded: compose aborts with this message rather than passing an
      # empty password to initdb, which fails later and far less clearly.
      POSTGRES_USER: '${POSTGRES_USER:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      POSTGRES_DB: '${POSTGRES_DB:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      # Deterministic collation keeps ORDER BY results identical across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Named volume, never a Windows bind mount: PostgreSQL refuses to
      # initialise on a filesystem that cannot express Unix ownership.
      - postgres_data:/var/lib/postgresql/data
      # Idempotent SQL run once, only when the volume is first created.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only. Docker publishes to 0.0.0.0 by default, which would
      # put PostgreSQL on every interface this host has.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: '${POSTGRES_USER:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      POSTGRES_DB: '${POSTGRES_DB:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      SECRET_KEY: '${SECRET_KEY:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      INGEST_API_KEY: '${INGEST_API_KEY:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-7}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_ANALYST_EMAIL: ${DEMO_ANALYST_EMAIL}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD}
      DEMO_RESPONDER_EMAIL: ${DEMO_RESPONDER_EMAIL}
      DEMO_RESPONDER_PASSWORD: ${DEMO_RESPONDER_PASSWORD}
      DEMO_VIEWER_EMAIL: ${DEMO_VIEWER_EMAIL}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD}
    volumes:
      # Source bind mount gives uvicorn --reload on the host's edits.
      - ./backend:/app
      # Anonymous volume shields container-installed caches from the host tree.
      - /app/.pytest_cache
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-58000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Synthetic telemetry generator
  # ---------------------------------------------------------------------------
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: soc-generator
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      GENERATOR_BACKEND_URL: ${GENERATOR_BACKEND_URL:-http://backend:8000}
      GENERATOR_EVENTS_PER_SECOND: ${GENERATOR_EVENTS_PER_SECOND:-2.0}
      GENERATOR_BATCH_INTERVAL_SECONDS: ${GENERATOR_BATCH_INTERVAL_SECONDS:-5}
      GENERATOR_ATTACK_PROBABILITY: ${GENERATOR_ATTACK_PROBABILITY:-0.12}
      GENERATOR_SEED: ${GENERATOR_SEED:-}
      INGEST_API_KEY: '${INGEST_API_KEY:?run scripts/init-env.ps1 first - .env is missing or this value is empty}'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./generator:/app
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # React frontend (Vite dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # Vite inlines VITE_* variables at dev-server start. This is the URL the
      # BROWSER uses, so it is localhost on the host, not the compose hostname.
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-58000}/api/v1
      # Windows/WSL2 does not reliably deliver inotify events across the
      # bind mount, so Vite must poll or hot reload silently stops working.
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_POLL: "true"
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-54173}
    volumes:
      - ./frontend:/app
      # Anonymous volume MUST come after the bind mount. Without it the host's
      # empty (git-ignored) node_modules shadows the image's, and the container
      # starts with no dependencies installed.
      - /app/node_modules
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-54173}:5173"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: soc_postgres_data
